{% extends "base.html" %}
{% block main %}
<section id="two">
  <div class="inner" style="padding: 20px 0 1em 0">
    {% for error in errors %}
    <p style="color: red">{{ error }}</p>
    {% endfor %}
    <h1>Scan ISBN</h1>

    <div id="scannerControls">
      <div id="reader" style="width: 100%; max-width: 600px; margin: auto; border: 2px solid #333; border-radius: 8px; overflow: hidden; background: #000;"></div>
      
      <div style="text-align: center; margin-top: 20px;">
        <a style="text-decoration:none !important;" href="/addisbn">
          <button type="button">Manual Entry</button>
        </a>
      </div>
      <p id="scanMsg" style="color: #555; text-align: center; margin-top: 10px;"></p>
    </div>
  </div>
</section>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
  const scanMsg = document.getElementById('scanMsg');

  // Explicitly define the formats to stop the engine from "guessing"
  const formatsToSupport = [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128
  ];

  function onScanSuccess(decodedText, decodedResult) {
    console.log(`ISBN Detected: ${decodedText}`);
    scanMsg.textContent = "ISBN Found: " + decodedText;
    
    html5QrcodeScanner.clear().then(_ => {
        window.location.href = "/isbn/" + encodeURIComponent(decodedText) + "/scan";
    }).catch(error => {
        window.location.href = "/isbn/" + encodeURIComponent(decodedText) + "/scan";
    });
  }

  // HARDENING: We use the more powerful configuration object here
  let html5QrcodeScanner = new Html5QrcodeScanner(
    "reader",
    { 
        fps: 20, // Faster sampling for shaky hands
        qrbox: { width: 300, height: 180 }, 
        aspectRatio: 1.777778,
        rememberLastUsedCamera: true,
        formatsToSupport: formatsToSupport,
        // This leverages the iPhone's built-in hardware scanner if available
        experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
        }
    },
    /* verbose= */ false
  );

  html5QrcodeScanner.render(onScanSuccess);
</script>

<style>
  #reader { box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  #reader__dashboard_section_csr button {
      background-color: #444 !important;
      color: white !important;
      padding: 10px 20px !important;
      margin: 10px auto !important;
      border-radius: 4px !important;
      cursor: pointer;
      display: block;
  }
  #reader__status_span { display: none !important; }
</style>
{% endblock %}
